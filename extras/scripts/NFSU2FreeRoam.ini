; NFSU2FreeRoam.ini: free-roam multiplayer for Need for Speed Underground 2 on the PS Vita port, the same
; settings as the PC's NFSU2FreeRoam.asi plugin (NFSU2 Revived). Install it as on PC: copy this file into
; the "scripts" folder of the game folder, ux0:data/NeedForSpeedUnderground2/scripts/ (the Vita has the
; free-roam code built in, so there is no .asi to copy). Messages go to scripts/NFSU2FreeRoam.log.
; On the Vita, free roam goes through the NFSU2 Revived server (network=revived, the default): you meet
; the players of nfsu2.xyz in the city. Port, Peers and Discovery are the PC's LAN settings and are
; best left as they are.

[FreeRoam]
; 1 = on, 0 = the plugin does nothing
Enable = 1

; the name your friends see (printable ASCII, up to 24 characters);
; empty = your game profile's name
Name =

; UDP port, the same on every machine (Mac: roam_port in settings.ini)
Port = 47210

; friends' IP addresses, if they do not show up by themselves (some routers
; and VPNs block the LAN broadcast); one is enough, the others are passed on:
; Peers = 192.168.1.20, 192.168.1.21:47210
Peers =

; 1 = find friends on the LAN by a broadcast every 2 s
Discovery = 1

; only players with the same room name see each other (empty = everybody)
Room =

; your crews, up to 4, joined by commas: players who share one see each other's
; names and map arrows in its colour, everyone else still there
; (Crew = Blue Room, Night Owls; empty = none)
Crew =

; each crew's colour in the order of Crew, 6 hex digits without '#'
; (CrewColours = 3cd2ff, ff4646; empty = cyan, magenta, violet, red)
CrewColours =

; 1 = friends' cars are solid (EXPERIMENTAL: they can shove your car);
; 0 = ghost cars you drive through
Collide = 0

; group size, you included (2..33), and friends' cars shown at once (0..5).
; The Vita's defaults are lower than the PC's 33 and 5: every car shown is a car load,
; and many players near you slow the game down
MaxPlayers = 8
MaxCars = 2

; memory for the cars in free roam, in KB (empty = the game's choice). 24000 is what
; the Vita has been tested with; a car that does not fit is not shown, it does not crash
CarPoolKB = 24000

; names over the other players' cars (1) or not (0)
Names = 1

; your flag before your name, a code from roam/flags.dat such as gb, us, de, gb-eng
; (empty = none). Vita Settings > Free Roam picks it from a list
Flag =

; the flags before the names drawn on your screen (1) or not (0)
ShowFlags = 1

; races with other players (as on nfsu2.xyz): a lobby another player opens at a race marker
; shows over it and on the world map; drive up to it and press the event button to join. The
; Vita joins lobbies only (hosting needs the PC game's server.dll). 1 = on, 0 = off
Races = 1

; a ring on the ground at race spots whose career marker is gone (won, or not open in your
; career): blue while nobody hosts a race there, gold while a lobby is open. 1 = on, 0 = off
RaceRings = 1

; quick chat: hold quick_chat_button (NeedForSpeedUnderground2.cfg, D-pad Down by default)
; and press a phrase button. 1 = on, 0 = off
QuickChat = 1

; the phrases of the six buttons, by their numbers in nfsu2.xyz's list
; (0 Hey!, 1 Nice car!, 2 Thanks!, 8 Follow me!, 12 Race?, 14 gg). With the D-pad Down
; button they are Up, Left, Right, Cross, Circle and Square; Vita Settings > Friends and
; crews picks them from the list
Say1 = 0
Say2 = 2
Say3 = 12
Say4 = 8
Say5 = 14
Say6 = 1

; write scripts\NFSU2FreeRoam.log (1) or not (0)
Log = 1
