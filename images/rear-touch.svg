<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Rear touch pad buttons, seen from the back of the PS Vita</title>
  <rect width="960" height="600" rx="18" fill="#141832"/>

  <text x="480" y="44" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="700">Rear touch pad</text>

  <!-- body -->
  <rect x="120" y="170" width="720" height="300" rx="150" fill="#262b4d" stroke="#5b6499" stroke-width="3"/>
  <!-- finger grips -->
  <ellipse cx="205" cy="320" rx="52" ry="92" fill="#1d2140" stroke="#444c7c" stroke-width="2"/>
  <ellipse cx="755" cy="320" rx="52" ry="92" fill="#1d2140" stroke="#444c7c" stroke-width="2"/>
  <!-- camera -->
  <circle cx="480" cy="196" r="9" fill="#141832" stroke="#5b6499" stroke-width="2"/>
  <circle cx="480" cy="196" r="3.5" fill="#5b6499"/>

  <!-- touch pad quadrants -->
  <clipPath id="pad"><rect x="290" y="222" width="380" height="200" rx="12"/></clipPath>
  <g clip-path="url(#pad)">
    <rect x="290" y="222" width="190" height="100" fill="#ff3b5c" fill-opacity="0.30"/>
    <rect x="480" y="222" width="190" height="100" fill="#2f7bff" fill-opacity="0.30"/>
    <rect x="290" y="322" width="190" height="100" fill="#ffb02e" fill-opacity="0.28"/>
    <rect x="480" y="322" width="190" height="100" fill="#b44dff" fill-opacity="0.30"/>
  </g>
  <rect x="290" y="222" width="380" height="200" rx="12" fill="none" stroke="#c9cfee" stroke-width="2.5"/>
  <line x1="480" y1="222" x2="480" y2="422" stroke="#c9cfee" stroke-width="2" stroke-dasharray="7 6"/>
  <line x1="290" y1="322" x2="670" y2="322" stroke="#c9cfee" stroke-width="2" stroke-dasharray="7 6"/>

  <g fill="#ffffff" font-size="30" font-weight="700" text-anchor="middle">
    <text x="385" y="283">R2</text>
    <text x="575" y="283">L2</text>
    <text x="385" y="383">R3</text>
    <text x="575" y="383">L3</text>
  </g>

  <!-- leader lines -->
  <g fill="none" stroke-width="2.5" stroke-linecap="round">
    <polyline points="330,240 330,138 300,138" stroke="#ff6f88"/>
    <polyline points="630,240 630,138 660,138" stroke="#6ea4ff"/>
    <polyline points="330,404 330,512 300,512" stroke="#ffc35c"/>
    <polyline points="630,404 630,512 660,512" stroke="#cb85ff"/>
  </g>
  <g>
    <circle cx="330" cy="240" r="5" fill="#ff6f88"/>
    <circle cx="630" cy="240" r="5" fill="#6ea4ff"/>
    <circle cx="330" cy="404" r="5" fill="#ffc35c"/>
    <circle cx="630" cy="404" r="5" fill="#cb85ff"/>
  </g>

  <!-- callouts -->
  <g font-size="19" font-weight="700">
    <text x="290" y="132" text-anchor="end" fill="#ff6f88">R2 · not bound</text>
    <text x="670" y="132" fill="#6ea4ff">L2 · not bound</text>
    <text x="290" y="506" text-anchor="end" fill="#ffc35c">R3 · not bound</text>
    <text x="670" y="506" fill="#cb85ff">L3 · not bound</text>
  </g>
  <g font-size="14" fill="#9aa3c7">
    <text x="290" y="152" text-anchor="end">upper corner, right hand</text>
    <text x="670" y="152">upper corner, left hand</text>
    <text x="290" y="526" text-anchor="end">lower corner, right hand</text>
    <text x="670" y="526">lower corner, left hand</text>
  </g>

  <text x="480" y="572" text-anchor="middle" fill="#9aa3c7" font-size="14">The game sees a PlayStation 2 controller. They are not bound by default; set them in Options &gt; Controls.</text>
</svg>
